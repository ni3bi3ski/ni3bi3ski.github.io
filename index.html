<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fotograf Bielsko-Biała | Reportaż, portret, event</title>
  <meta name="description" content="Fotograf z Bielska-Białej. Reportaż, portret i fotografia eventowa na Śląsku i w Polsce." />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070707;
      --text: #edeae3;
      --muted: #706c65;
      --faint: #343230;
      --accent: #c8a352;
      --border: rgba(255,255,255,0.06);
      --max: 1440px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    * { cursor: none !important; }

    #cur {
      position: fixed; z-index: 9999;
      pointer-events: none; top: 0; left: 0;
    }
    #cur-dot {
      width: 6px; height: 6px;
      background: var(--text); border-radius: 50%;
      position: absolute; transform: translate(-50%,-50%);
      transition: width .18s, height .18s, background .18s;
    }
    #cur-ring {
      width: 32px; height: 32px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      position: absolute; transform: translate(-50%,-50%);
      transition: width .3s cubic-bezier(.25,.46,.45,.94),
                  height .3s cubic-bezier(.25,.46,.45,.94),
                  border-color .3s;
    }
    #cur.on-link #cur-dot { width: 3px; height: 3px; background: var(--accent); }
    #cur.on-link #cur-ring { width: 52px; height: 52px; border-color: var(--accent); }
    #cur.on-img #cur-dot { width: 48px; height: 48px; background: rgba(200,163,82,0.12); backdrop-filter: blur(2px); }
    #cur.on-img #cur-ring { width: 52px; height: 52px; opacity: 0; }

    body {
      font-family: 'Satoshi', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      overflow-x: hidden; line-height: 1.55;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    nav {
      position: fixed; inset: 0 0 auto 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px clamp(20px, 4vw, 64px);
      transition: background .5s, backdrop-filter .5s, border-color .5s;
      border-bottom: 1px solid transparent;
    }
    nav.solid {
      background: rgba(7,7,7,0.88);
      backdrop-filter: blur(20px);
      border-color: var(--border);
    }
    .nav-logo {
      font-size: 12px; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--muted);
      transition: color .2s;
    }
    .nav-logo:hover { color: var(--text); }
    .nav-links {
      display: flex; gap: 28px;
      font-size: 12px; letter-spacing: 0.08em; color: var(--muted);
    }
    .nav-toggle {
      display: none;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      font: inherit;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .nav-links a { transition: color .2s; }
    .nav-links a:hover { color: var(--text); }
    .nav-links.open { display: flex; }

    .hero {
      height: 100svh; min-height: 600px;
      position: relative; overflow: hidden;
      display: flex; align-items: flex-end;
    }
    .hero-img { position: absolute; inset: 0; will-change: transform; }
    .hero-img img {
      width: 100%; height: 115%;
      object-fit: cover; object-position: center 18%;
      filter: brightness(0.38);
    }
    .img-responsive { width: 100%; height: auto; display: block; }
    .hero-img::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 30%, rgba(7,7,7,0.55) 65%, rgba(7,7,7,0.98) 100%);
    }
    .hero-inner {
      position: relative; z-index: 2; width: 100%;
      padding: 0 clamp(20px,4vw,64px) clamp(48px,6vh,80px);
      display: grid; grid-template-columns: 1fr auto;
      align-items: flex-end; gap: 40px;
    }
    .hero-title {
      font-size: clamp(68px, 12vw, 172px);
      line-height: 0.84; letter-spacing: -0.07em;
      font-weight: 900; text-transform: uppercase;
    }
    .hero-title .line { overflow: hidden; display: block; }
    .hero-title .line span {
      display: block; transform: translateY(105%);
      transition: transform 1.1s cubic-bezier(0.16,1,0.3,1);
    }
    .hero-title .line:nth-child(2) span { transition-delay: .1s; }
    .hero-title.go .line span { transform: translateY(0); }

    .hero-aside {
      text-align: right; padding-bottom: 8px; min-width: 200px;
      opacity: 0; transform: translateY(14px);
      transition: opacity .9s ease .7s, transform .9s ease .7s;
    }
    .hero-aside.go { opacity: 1; transform: translateY(0); }
    .hero-tag {
      font-size: 11px; letter-spacing: 0.24em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
    }
    .hero-note { font-size: 14px; color: var(--muted); line-height: 1.6; }

    .hero-scroll {
      position: absolute; bottom: 28px; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      z-index: 2; opacity: 0;
      animation: fadeup .8s ease 1.5s forwards;
    }
    .hero-scroll span {
      font-size: 9px; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--faint);
    }
    .scroll-line {
      width: 1px; height: 36px;
      background: var(--faint); position: relative; overflow: hidden;
    }
    .scroll-line::after {
      content: ''; position: absolute; top: -100%; left: 0;
      width: 1px; height: 100%; background: var(--accent);
      animation: drop 2s ease 1.5s infinite;
    }
    @keyframes drop { 0%{top:-100%} 100%{top:100%} }
    @keyframes fadeup { to { opacity: 1; } }

    .marquee {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 13px 0; overflow: hidden;
    }
    .marquee-track {
      display: flex; width: max-content;
      animation: scroll 28s linear infinite;
    }
    .marquee-track:hover { animation-play-state: paused; }
    .m-item {
      font-size: 11px; letter-spacing: 0.26em;
      text-transform: uppercase; color: var(--faint);
      padding: 0 28px; white-space: nowrap;
    }
    .m-dot { color: var(--accent); margin-right: 28px; }
    @keyframes scroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }

    /* ── FEATURED (kompaktowy) ── */
    .featured { padding: clamp(48px,6vw,80px) clamp(20px,4vw,64px); }
    .featured-label {
      font-size: 11px; letter-spacing: 0.26em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 20px;
      opacity: 0; transform: translateY(18px);
      transition: opacity .6s, transform .6s;
    }
    .featured-label.go { opacity: 1; transform: translateY(0); }
    .featured-card {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 2px; overflow: hidden; border-radius: 2px;
    }
    .featured-img {
      position: relative; overflow: hidden; aspect-ratio: 16/9;
      opacity: 0; transform: translateX(-24px);
      transition: opacity .8s ease, transform .8s ease;
    }
    .featured-img.go { opacity: 1; transform: translateX(0); }
    .featured-img img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .7s cubic-bezier(.25,.46,.45,.94);
    }
    .featured-card:hover .featured-img img { transform: scale(1.04); }
    .featured-body {
      background: rgba(255,255,255,0.02); border: 1px solid var(--border);
      padding: clamp(20px,3vw,36px);
      display: flex; flex-direction: column; justify-content: space-between;
      opacity: 0; transform: translateX(24px);
      transition: opacity .8s ease .1s, transform .8s ease .1s;
    }
    .featured-body.go { opacity: 1; transform: translateX(0); }
    .feat-num {
      font-size: 11px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--accent);
    }
    .feat-title {
      font-size: clamp(22px, 2.5vw, 38px);
      font-weight: 900; letter-spacing: -0.05em;
      line-height: 1; margin: 12px 0 10px;
    }
    .feat-desc { font-size: 14px; color: var(--muted); line-height: 1.7; }
    .feat-link {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text); border-bottom: 1px solid var(--faint);
      padding-bottom: 4px; align-self: flex-start; margin-top: 20px;
      transition: border-color .2s, color .2s;
    }
    .feat-link:hover { border-color: var(--accent); color: var(--accent); }

    /* ── WORK ── */
    .work { padding: 0 clamp(20px,4vw,64px) clamp(80px,10vw,140px); }
    .work-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 48px;
      opacity: 0; transform: translateY(18px);
      transition: opacity .6s, transform .6s;
    }
    .work-header.go { opacity: 1; transform: translateY(0); }
    .sec-label {
      font-size: 11px; letter-spacing: 0.26em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
    }
    .sec-title {
      font-size: clamp(34px,5vw,68px);
      font-weight: 900; letter-spacing: -0.05em;
      text-transform: uppercase; line-height: .9;
    }
    .all-link {
      font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); border-bottom: 1px solid var(--faint);
      padding-bottom: 2px; transition: color .2s, border-color .2s;
    }
    .all-link:hover { color: var(--text); border-color: var(--accent); }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
    .p-item {
      position: relative; overflow: hidden;
      aspect-ratio: 4/3; background: #111;
      opacity: 0; transform: translateY(24px);
      transition: opacity .7s ease, transform .7s ease;
    }
    .p-item.go { opacity: 1; transform: translateY(0); }
    .p-item:nth-child(2) { transition-delay: .08s; }
    .p-item:nth-child(3) { transition-delay: .14s; }
    .p-item:nth-child(4) { transition-delay: .2s; }
    .p-item:nth-child(5) { transition-delay: .26s; }
    .p-item:nth-child(6) { transition-delay: .32s; }
    .p-item:nth-child(7) { transition-delay: .38s; }
    .p-item img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .65s cubic-bezier(.25,.46,.45,.94), filter .5s;
      filter: brightness(.72);
    }
    .p-item:hover img { transform: scale(1.06); filter: brightness(.45); }
    .p-info {
      position: absolute; inset: 0; padding: 24px 28px;
      display: flex; flex-direction: column; justify-content: flex-end;
      background: linear-gradient(to top, rgba(0,0,0,.78) 0%, transparent 52%);
    }
    .p-num {
      font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 5px; opacity: .7;
      transform: translateY(6px);
      transition: transform .35s ease, opacity .35s ease;
    }
    .p-name {
      font-size: clamp(16px,2vw,24px); font-weight: 700;
      letter-spacing: -0.03em; line-height: 1.1;
      transform: translateY(6px);
      transition: transform .35s ease .04s;
    }
    .p-open {
      font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
      color: var(--accent); margin-top: 8px; opacity: 0;
      transform: translateY(10px);
      transition: opacity .3s ease .06s, transform .3s ease .06s;
    }
    .p-item:hover .p-num,
    .p-item:hover .p-name { transform: translateY(0); opacity: 1; }
    .p-item:hover .p-open { opacity: 1; transform: translateY(0); }
    .p-item.extra { display: none; }
    .p-item.extra.show { display: block; }

    .load-wrap { text-align: center; margin-top: 40px; }
    .btn-more {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 13px 30px; border: 1px solid var(--faint);
      border-radius: 999px; font-size: 12px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted);
      background: none; font-family: inherit;
      transition: border-color .25s, color .25s, background .25s;
    }
    .btn-more:hover { border-color: var(--accent); color: var(--text); background: rgba(200,163,82,.04); }
    .btn-arrow { transition: transform .35s ease; }
    .btn-more.open .btn-arrow { transform: rotate(180deg); }

    /* ── ABOUT (kompaktowy) ── */
    .about {
      border-top: 1px solid var(--border);
      padding: clamp(40px,6vw,80px) clamp(20px,4vw,64px);
      display: grid; grid-template-columns: auto 1fr;
      gap: clamp(32px,5vw,80px); align-items: center;
    }
    .about-img-wrap {
      width: clamp(160px, 22vw, 280px);
      border-radius: 4px;
      position: relative; overflow: hidden;
      aspect-ratio: 3/4;
      opacity: 0; transition: opacity .9s ease;
      flex-shrink: 0;
    }
    .about-img-wrap.go { opacity: 1; }
    .about-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center 12%;
      transition: transform .7s ease;
    }
    .about-img-wrap:hover img { transform: scale(1.03); }
    .about-badge {
      position: absolute; bottom: 10px; left: 10px;
      background: rgba(7,7,7,.82); backdrop-filter: blur(14px);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 5px 12px; font-size: 10px;
      letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    }
    .about-body {
      display: flex; flex-direction: column; justify-content: center;
    }
    .about-body .sec-label { margin-bottom: 8px; }
    .about-heading {
      font-size: clamp(26px,3.5vw,48px); font-weight: 900;
      letter-spacing: -0.05em; text-transform: uppercase; line-height: .95;
      margin-bottom: 14px;
      opacity: 0; transform: translateY(20px);
      transition: opacity .7s ease, transform .7s ease;
    }
    .about-heading.go { opacity: 1; transform: translateY(0); }
    .about-mission {
      font-size: clamp(15px,1.4vw,17px); color: var(--text);
      line-height: 1.55; margin-bottom: 10px; font-weight: 500;
      opacity: 0; transform: translateY(20px);
      transition: opacity .7s ease .1s, transform .7s ease .1s;
    }
    .about-mission.go { opacity: 1; transform: translateY(0); }
    .about-sub {
      font-size: 14px; color: var(--muted); line-height: 1.72;
      margin-bottom: 22px;
      opacity: 0; transform: transl
