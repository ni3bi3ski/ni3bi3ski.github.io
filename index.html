  <style>
    :root {
      --bg: #070707;
      --text: #edeae3;
      --muted: #706c65;
      --faint: #343230;
      --accent: #c8a352;
      --border: rgba(255,255,255,0.06);
      --max: 1440px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    * { cursor: none !important; }

    #cur {
      position: fixed; z-index: 9999;
      pointer-events: none; top: 0; left: 0;
    }
    #cur-dot {
      width: 6px; height: 6px;
      background: var(--text); border-radius: 50%;
      position: absolute; transform: translate(-50%,-50%);
      transition: width .18s, height .18s, background .18s;
    }
    #cur-ring {
      width: 32px; height: 32px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      position: absolute; transform: translate(-50%,-50%);
      transition: width .3s cubic-bezier(.25,.46,.45,.94),
                  height .3s cubic-bezier(.25,.46,.45,.94),
                  border-color .3s;
    }
    #cur.on-link #cur-dot { width: 3px; height: 3px; background: var(--accent); }
    #cur.on-link #cur-ring { width: 52px; height: 52px; border-color: var(--accent); }
    #cur.on-img #cur-dot { width: 48px; height: 48px; background: rgba(200,163,82,0.12); backdrop-filter: blur(2px); }
    #cur.on-img #cur-ring { width: 52px; height: 52px; opacity: 0; }

    body {
      font-family: 'Satoshi', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      overflow-x: hidden; line-height: 1.55;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    nav {
      position: fixed; inset: 0 0 auto 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px clamp(20px, 4vw, 64px);
      transition: background .5s, backdrop-filter .5s, border-color .5s;
      border-bottom: 1px solid transparent;
    }
    nav.solid {
      background: rgba(7,7,7,0.88);
      backdrop-filter: blur(20px);
      border-color: var(--border);
    }
    .nav-logo {
      font-size: 12px; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--muted);
      transition: color .2s;
    }
    .nav-logo:hover { color: var(--text); }
    .nav-links {
      display: flex; gap: 28px;
      font-size: 12px; letter-spacing: 0.08em; color: var(--muted);
    }
    .nav-toggle {
      display: none;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      font: inherit;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .nav-links a { transition: color .2s; }
    .nav-links a:hover { color: var(--text); }
    .nav-links.open { display: flex; }

    .hero {
      height: 100svh; min-height: 600px;
      position: relative; overflow: hidden;
      display: flex; align-items: flex-end;
    }
    .hero-img { position: absolute; inset: 0; will-change: transform; }
    .hero-img img {
      width: 100%; height: 115%;
      object-fit: cover; object-position: center 18%;
      filter: brightness(0.38);
    }
    .img-responsive { width: 100%; height: auto; display: block; }
    .hero-img::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 30%, rgba(7,7,7,0.55) 65%, rgba(7,7,7,0.98) 100%);
    }
    .hero-inner {
      position: relative; z-index: 2; width: 100%;
      padding: 0 clamp(20px,4vw,64px) clamp(48px,6vh,80px);
      display: grid; grid-template-columns: 1fr auto;
      align-items: flex-end; gap: 40px;
    }
    .hero-title {
      font-size: clamp(68px, 12vw, 172px);
      line-height: 0.84; letter-spacing: -0.07em;
      font-weight: 900; text-transform: uppercase;
    }
    .hero-title .line { overflow: hidden; display: block; }
    .hero-title .line span {
      display: block; transform: translateY(105%);
      transition: transform 1.1s cubic-bezier(0.16,1,0.3,1);
    }
    .hero-title .line:nth-child(2) span { transition-delay: .1s; }
    .hero-title.go .line span { transform: translateY(0); }

    .hero-aside {
      text-align: right; padding-bottom: 8px; min-width: 200px;
      opacity: 0; transform: translateY(14px);
      transition: opacity .9s ease .7s, transform .9s ease .7s;
    }
    .hero-aside.go { opacity: 1; transform: translateY(0); }
    .hero-tag {
      font-size: 11px; letter-spacing: 0.24em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
    }
    .hero-note { font-size: 14px; color: var(--muted); line-height: 1.6; }

    .hero-scroll {
      position: absolute; bottom: 28px; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      z-index: 2; opacity: 0;
      animation: fadeup .8s ease 1.5s forwards;
    }
    .hero-scroll span {
      font-size: 9px; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--faint);
    }
    .scroll-line {
      width: 1px; height: 36px;
      background: var(--faint); position: relative; overflow: hidden;
    }
    .scroll-line::after {
      content: ''; position: absolute; top: -100%; left: 0;
      width: 1px; height: 100%; background: var(--accent);
      animation: drop 2s ease 1.5s infinite;
    }
    @keyframes drop { 0%{top:-100%} 100%{top:100%} }
    @keyframes fadeup { to { opacity: 1; } }

    .marquee {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 13px 0; overflow: hidden;
    }
    .marquee-track {
      display: flex; width: max-content;
      animation: scroll 28s linear infinite;
    }
    .marquee-track:hover { animation-play-state: paused; }
    .m-item {
      font-size: 11px; letter-spacing: 0.26em;
      text-transform: uppercase; color: var(--faint);
      padding: 0 28px; white-space: nowrap;
    }
    .m-dot { color: var(--accent); margin-right: 28px; }
    @keyframes scroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }

    .featured { padding: clamp(80px,10vw,140px) clamp(20px,4vw,64px); }
    .featured-label {
      font-size: 11px; letter-spacing: 0.26em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 32px;
      opacity: 0; transform: translateY(18px);
      transition: opacity .6s, transform .6s;
    }
    .featured-label.go { opacity: 1; transform: translateY(0); }
    .featured-card {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 2px; overflow: hidden; border-radius: 2px;
    }
    .featured-img {
      position: relative; overflow: hidden; aspect-ratio: 4/3;
      opacity: 0; transform: translateX(-24px);
      transition: opacity .8s ease, transform .8s ease;
    }
    .featured-img.go { opacity: 1; transform: translateX(0); }
    .featured-img img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .7s cubic-bezier(.25,.46,.45,.94);
    }
    .featured-card:hover .featured-img img { transform: scale(1.04); }
    .featured-body {
      background: rgba(255,255,255,0.02); border: 1px solid var(--border);
      padding: clamp(28px,4vw,52px);
      display: flex; flex-direction: column; justify-content: space-between;
      opacity: 0; transform: translateX(24px);
      transition: opacity .8s ease .1s, transform .8s ease .1s;
    }
    .featured-body.go { opacity: 1; transform: translateX(0); }
    .feat-num {
      font-size: 11px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--accent);
    }
    .feat-title {
      font-size: clamp(28px, 3.5vw, 52px);
      font-weight: 900; letter-spacing: -0.05em;
      line-height: 1; margin: 20px 0 16px;
    }
    .feat-desc { font-size: 15px; color: var(--muted); line-height: 1.7; }
    .feat-link {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text); border-bottom: 1px solid var(--faint);
      padding-bottom: 4px; align-self: flex-start; margin-top: 32px;
      transition: border-color .2s, color .2s;
    }
    .feat-link:hover { border-color: var(--accent); color: var(--accent); }

    .work { padding: 0 clamp(20px,4vw,64px) clamp(80px,10vw,140px); }
    .work-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 48px;
      opacity: 0; transform: translateY(18px);
      transition: opacity .6s, transform .6s;
    }
    .work-header.go { opacity: 1; transform: translateY(0); }
    .sec-label {
      font-size: 11px; letter-spacing: 0.26em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
    }
    .sec-title {
      font-size: clamp(34px,5vw,68px);
      font-weight: 900; letter-spacing: -0.05em;
      text-transform: uppercase; line-height: .9;
    }
    .all-link {
      font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); border-bottom: 1px solid var(--faint);
      padding-bottom: 2px; transition: color .2s, border-color .2s;
    }
    .all-link:hover { color: var(--text); border-color: var(--accent); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
    .p-item {
      position: relative; overflow: hidden;
      aspect-ratio: 3/2; background: #111;
      opacity: 0; transform: translateY(24px);
      transition: opacity .7s ease, transform .7s ease;
    }
    .p-item.go { opacity: 1; transform: translateY(0); }
    .p-item:nth-child(2) { transition-delay: .08s; }
    .p-item:nth-child(3) { transition-delay: .14s; }
    .p-item:nth-child(4) { transition-delay: .2s; }
    .p-item img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .65s cubic-bezier(.25,.46,.45,.94), filter .5s;
      filter: brightness(.72);
    }
    .p-item:hover img { transform: scale(1.06); filter: brightness(.45); }
    .p-info {
      position: absolute; inset: 0; padding: 24px 28px;
      display: flex; flex-direction: column; justify-content: flex-end;
      background: linear-gradient(to top, rgba(0,0,0,.78) 0%, transparent 52%);
    }
    .p-num {
      font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 5px; opacity: .7;
      transform: translateY(6px);
      transition: transform .35s ease, opacity .35s ease;
    }
    .p-name {
      font-size: clamp(16px,2vw,24px); font-weight: 700;
      letter-spacing: -0.03em; line-height: 1.1;
      transform: translateY(6px);
      transition: transform .35s ease .04s;
    }
    .p-open {
      font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
      color: var(--accent); margin-top: 8px; opacity: 0;
      transform: translateY(10px);
      transition: opacity .3s ease .06s, transform .3s ease .06s;
    }
    .p-item:hover .p-num,
    .p-item:hover .p-name { transform: translateY(0); opacity: 1; }
    .p-item:hover .p-open { opacity: 1; transform: translateY(0); }
    .p-item.extra { display: none; }
    .p-item.extra.show { display: block; }

    .load-wrap { text-align: center; margin-top: 40px; }
    .btn-more {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 13px 30px; border: 1px solid var(--faint);
      border-radius: 999px; font-size: 12px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted);
      background: none; font-family: inherit;
      transition: border-color .25s, color .25s, background .25s;
    }
    .btn-more:hover { border-color: var(--accent); color: var(--text); background: rgba(200,163,82,.04); }
    .btn-arrow { transition: transform .35s ease; }
    .btn-more.open .btn-arrow { transform: rotate(180deg); }

    .about {
      border-top: 1px solid var(--border);
      padding: clamp(40px,5vw,72px) clamp(20px,4vw,48px);
    }
    .about-content {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 48px;
      align-items: center;
      max-width: var(--max);
      margin: 0 auto;
    }
    .about-img-wrap {
      position: relative;
      overflow: hidden;
      aspect-ratio: 3/4;
      max-height: 520px;
      opacity: 0;
      transition: opacity .9s ease;
    }
    .about-img-wrap.go { opacity: 1; }
    .about-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 12%;
      transition: transform .7s ease;
    }
    .about-img-wrap:hover img { transform: scale(1.03); }
    .about-badge {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(7,7,7,.82);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .about-text {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .about-text .sec-label { margin-bottom: 0; }
    .about-heading {
      font-size: clamp(28px,3.5vw,48px);
      font-weight: 900;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      line-height: 1.1;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .7s ease, transform .7s ease;
    }
    .about-heading.go { opacity: 1; transform: translateY(0); }
    .about-mission {
      font-size: 16px;
      color: var(--text);
      line-height: 1.6;
      font-weight: 500;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .7s ease .1s, transform .7s ease .1s;
    }
    .about-mission.go { opacity: 1; transform: translateY(0); }
    .about-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .7s ease .18s, transform .7s ease .18s;
    }
    .about-sub.go { opacity: 1; transform: translateY(0); }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .7s ease .24s, transform .7s ease .24s;
    }
    .stats.go { opacity: 1; transform: translateY(0); }
    .stat { border-top: 1px solid var(--border); padding-top: 12px; }
    .stat-n { font-size: 24px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
    .stat-n em { font-style: normal; color: var(--accent); }
    .stat-l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-top: 4px; }
    .about-benefits {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .7s ease .24s, transform .7s ease .24s;
    }
    .about-benefits.go { opacity: 1; transform: translateY(0); }
    .about-benefits .sec-label { margin-bottom: 12px; }
    .benefit-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .benefit-list li {
      font-size: 13px;
      line-height: 1.5;
    }
    .benefit-list li strong {
      color: var(--text);
      display: block;
      margin-bottom: 2px;
    }
    .benefit-list li span {
      color: var(--muted);
      font-size: 12px;
    }
    .gear-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .7s ease .3s, transform .7s ease .3s;
    }
    .gear-row.go { opacity: 1; transform: translateY(0); }
    .gear-chip {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      transition: border-color .2s, color .2s;
    }
    .gear-chip:hover { border-color: var(--accent); color: var(--text); }

    .services-pricing {
      border-top: 1px solid var(--border);
      padding: clamp(80px,10vw,140px) clamp(20px,4vw,64px);
    }
    .sp-header {
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .6s, transform .6s;
    }
    .sp-header.go { opacity: 1; transform: translateY(0); }
    .sp-intro {
      max-width: 780px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 56px;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .6s ease .08s, transform .6s ease .08s;
    }
    .sp-intro.go { opacity: 1; transform: translateY(0); }
    .sp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin-bottom: 40px;
    }
    .sp-card {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 300px;
      opacity: 0;
      transform: translateY(22px);
      transition: opacity .6s ease, transform .6s ease, border-color .25s ease, background .25s ease;
    }
    .sp-card.go { opacity: 1; transform: translateY(0); }
    .sp-card:hover {
      border-color: rgba(200,163,82,0.28);
      background: rgba(200,163,82,0.03);
    }
    .sp-card:nth-child(2) { transition-delay: .08s; }
    .sp-card:nth-child(3) { transition-delay: .16s; }
    .sp-num {
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 18px;
    }
    .sp-name {
      font-size: clamp(18px,2vw,24px);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 14px;
    }
    .sp-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.72;
      margin-bottom: 18px;
    }
    .sp-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
      margin-top: auto;
    }
    .sp-footer {
      max-width: 70ch;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .6s ease .12s, transform .6s ease .12s;
    }
    .sp-footer.go { opacity: 1; transform: translateY(0); }

    .testimonials {
      border-top: 1px solid var(--border);
      padding: clamp(80px,10vw,140px) clamp(20px,4vw,64px);
    }
    .testimonials-head {
      margin-bottom: 34px;
      max-width: 820px;
      opacity: 0; transform: translateY(18px);
      transition: opacity .6s, transform .6s;
    }
    .testimonials-head.go { opacity: 1; transform: translateY(0); }
    .testimonials-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      max-width: 60ch;
    }
    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 3px;
      margin-bottom: 48px;
    }
    .testimonial-card {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      padding: 28px;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0; transform: translateY(22px);
      transition: opacity .6s ease, transform .6s ease, border-color .25s ease, background .25s ease;
    }
    .testimonial-card.go { opacity: 1; transform: translateY(0); }
    .testimonial-card:hover {
      border-color: rgba(200,163,82,0.28);
      background: rgba(200,163,82,0.03);
    }
    .testimonial-card:nth-child(2) { transition-delay: .08s; }
    .testimonial-card:nth-child(3) { transition-delay: .16s; }
    .testimonial-kicker {
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 18px;
    }
    .testimonial-quote {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .testimonial-meta {
      margin-top: 24px;
      display: grid;
      gap: 4px;
    }
    .testimonial-meta strong {
      font-size: 13px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .testimonial-meta span {
      color: var(--muted);
      font-size: 13px;
    }

    .testimonial-form-wrap {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 32px;
      align-items: start;
      border-top: 1px solid var(--border);
      padding-top: 36px;
    }
    .testimonial-form-intro {
      opacity: 0; transform: translateY(18px);
      transition: opacity .6s ease, transform .6s ease;
    }
    .testimonial-form-intro.go { opacity: 1; transform: translateY(0); }
    .testimonial-form-title {
      font-size: clamp(24px,3vw,40px);
      font-weight: 900;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      line-height: .95;
      margin-bottom: 14px;
    }
    .testimonial-form-text {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
      max-width: 44ch;
    }
    .testimonial-form {
      display: grid;
      gap: 16px;
      opacity: 0; transform: translateY(18px);
      transition: opacity .6s ease .08s, transform .6s ease .08s;
    }
    .testimonial-form.go { opacity: 1; transform: translateY(0); }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .testimonial-form label {
      display: grid;
      gap: 8px;
    }
    .testimonial-form label span {
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .testimonial-form input,
    .testimonial-form textarea {
      width: 100%;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 16px;
      border-radius: 14px;
      font: inherit;
      transition: border-color .2s ease, background .2s ease;
    }
    .testimonial-form input::placeholder,
    .testimonial-form textarea::placeholder {
      color: #6e6a64;
    }
    .testimonial-form input:focus,
    .testimonial-form textarea:focus {
      outline: none;
      border-color: rgba(200,163,82,0.45);
      background: rgba(255,255,255,0.03);
    }
    .check {
      display: flex !important;
      gap: 12px;
      align-items: flex-start;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .check input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--accent);
    }
    .testimonial-submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 22px;
      border: 1px solid var(--faint);
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text);
      background: transparent;
      font-family: inherit;
      transition: border-color .25s, color .25s, background .25s;
    }
    .testimonial-submit:hover {
      border-color: var(--accent);
      background: rgba(200,163,82,.05);
    }
    .testimonial-legal {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .contact {
      border-top: 1px solid var(--border);
      padding: clamp(48px,6vw,88px) clamp(20px,4vw,64px);
      text-align: center;
    }
    .contact-eyebrow {
      font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 22px;
      opacity: 0; transform: translateY(14px);
      transition: opacity .6s, transform .6s;
    }
    .contact-eyebrow.go { opacity: 1; transform: translateY(0); }
    .contact-h {
      font-size: clamp(56px,10vw,148px); font-weight: 900;
      letter-spacing: -0.07em; text-transform: uppercase; line-height: .84;
      margin-bottom: 48px;
      opacity: 0; transform: translateY(22px);
      transition: opacity .7s ease .08s, transform .7s ease .08s;
    }
    .contact-h.go { opacity: 1; transform: translateY(0); }
    .contact-h em { font-style: normal; color: var(--accent); }
    .contact-row {
      display: flex; justify-content: center; gap: 40px; flex-wrap: wrap;
      opacity: 0; transform: translateY(14px);
      transition: opacity .6s ease .18s, transform .6s ease .18s;
    }
    .contact-row.go { opacity: 1; transform: translateY(0); }
    .c-link {
      font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); border-bottom: 1px solid var(--faint);
      padding-bottom: 4px; transition: color .2s, border-color .2s;
    }
    .c-link:hover { color: var(--text); border-color: var(--accent); }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 3px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 22px clamp(20px,4vw,64px);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px;
      font-size: 11px; letter-spacing: .08em; color: var(--muted);
    }
    footer a:hover { color: var(--text); }

    @media (max-width: 960px) {
      .featured-card, .testimonials-grid, .testimonial-form-wrap, .form-grid { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .hero-inner { grid-template-columns: 1fr; }
      .hero-aside { text-align: left; }
      .nav-toggle { display: inline-flex; align-items: center; }
      .nav-links {
        display: none;
        position: absolute;
        top: 72px;
        right: 20px;
        background: rgba(7,7,7,.96);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 14px 16px;
        flex-direction: column;
        gap: 14px;
        min-width: 180px;
        backdrop-filter: blur(18px);
      }
      .nav-links.open { display: flex; }
      .about-content {
        grid-template-columns: 1fr;
        gap: 28px;
      }
      .about-grid {
        grid-template-columns: 1fr;
      }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .sp-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      * { cursor: auto !important; }
      #cur { display: none; }
    }
  </style>
</head>

<div id="cur"><div id="cur-dot"></div><div id="cur-ring"></div></div>

<nav id="nav">
  <a href="/" class="nav-logo">Jarek Żurawski</a>
  <button class="nav-toggle" id="nav-toggle">Menu</button>
  <div class="nav-links" id="nav-links">
    <a href="#work">Prace</a>
    <a href="#about">O mnie</a>
    <a href="#services">Usługi</a>
    <a href="#pricing">Cennik</a>
    <a href="#opinie">Opinie</a>
    <a href="https://niebiezki.myportfolio.com/" target="_blank">Portfolio</a>
    <a href="#contact">Kontakt</a>
  </div>
</nav>

<!-- REST OF HTML CONTENT (HERO, PROJECTS, ABOUT, SERVICES/PRICING, TESTIMONIALS, CONTACT) SAME AS BEFORE -->

<footer>
  <p>&copy; 2026 Jarek Żurawski. Wszystkie prawa zastrzeżone.</p>
  <p><a href="https://instagram.com/niebiezki" target="_blank">Instagram</a> · <a href="https://niebiezki.myportfolio.com/" target="_blank">Portfolio</a></p>
</footer>

<script>
  const observerOptions = { threshold: 0.15 };
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('go');
      }
    });
  }, observerOptions);

  document.querySelectorAll('#hero-title, #hero-aside, #feat-label, #feat-img, #feat-body, #work-head, .p-item, #about-img, #about-h, #about-m, #about-s, #about-stats, .about-benefits, #gear, .sp-header, .sp-intro, .sp-card, .sp-footer, #test-head, .testimonial-card, #test-intro, #test-form, #c-eyebrow, #c-h, #c-row').forEach(el => observer.observe(el));

  document.getElementById('nav-toggle')?.addEventListener('click', function() {
    const nav = document.getElementById('nav-links');
    nav.classList.toggle('open');
  });

  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('solid', window.scrollY > 50);
  });

  const btnMore = document.getElementById('btn-more');
  if (btnMore) {
    btnMore.addEventListener('click', function() {
      this.classList.toggle('open');
      document.querySelectorAll('.p-item.extra').forEach(el => el.classList.toggle('show'));
    });
  }

  document.getElementById('test-form')?.addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Dziękuję za opinię!');
    this.reset();
  });
</script>

</body>
